esphome:
  name: basic-hmi-28-24-inch
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio
  friendly_name: Basic_HMI_28_24_inch

esp32:
  board: esp32dev
  framework:
    type: arduino

psram:
  mode: quad
  speed: 80MHz

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "WGb7XTS85smXPXLLDXcQ3qrXalr+amPrTNRYpFBtX6g="

ota:
  - platform: esphome
    password: "9ac93abb5a51b6b78d08dbf7bdbdbed0"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Basic-Hmi-28-24-Inch"
    password: "8fJaZUnpamkh"

captive_portal:

# ----- Output (Backlight PWM  / Backlight PWM Control) -----  # Backlight PWM output configuration
output:
  - platform: ledc
    pin: GPIO27
    inverted: False
    id: backlight_pwm                   # Backlight PWM channel ID

# ----- GPIO25 changed to switch -----  # GPIO25 configured as a digital switch
switch:
  - platform: gpio
    pin: GPIO25
    id: led_switch
    name: "External LED"                # External LED switch name
    restore_mode: RESTORE_DEFAULT_OFF   # Default state after reboot: OFF

# ----- Backlight -----  # Display backlight light entity
light:
  - platform: monochromatic
    output: backlight_pwm       # Uses PWM output defined above
    name: "Display Backlight"   # Backlight entity name
    id: back_light
    restore_mode: ALWAYS_ON     # Always ON after reboot

# ----- Fonts -----  # Font definitions for display rendering
font:
  - file: "gfonts://Roboto"
    id: font4
    size: 48   # Large font size
  - file: "gfonts://Roboto"
    id: font3
    size: 36
  - file: "gfonts://Roboto"
    id: font2
    size: 24
  - file: "gfonts://Roboto"
    id: font1
    size: 12

# ----- I2C (AHT20 sensor) -----  # I2C bus for temperature and humidity sensor
i2c:
  sda: GPIO22
  scl: GPIO21
  scan: true   # Scan I2C devices on startup

sensor:
  - platform: aht10
    variant: AHT20   # Sensor type: AHT20
    address: 0x38    # I2C address of sensor
    temperature:
      name: "HMI-24 Temperature"   # Temperature sensor name
      id: temperature24
    humidity:
      name: "HMI-24 Humidity"      # Humidity sensor name
      id: humidity24
    update_interval: 5s   # Sensor update interval

# ----- SPI (Display + Touch shared bus) -----  # SPI bus for LCD and touchscreen
spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO12

# ----- Touchscreen (XPT2046) -----  # Resistive touchscreen configuration
touchscreen:
  - platform: xpt2046
    id: my_touch
    cs_pin: GPIO33          # Chip select pin for touch controller
    # irq_pin: GPIO36       # Optional interrupt pin
    update_interval: 50ms   # Touch polling interval
    calibration:
      x_min: 200
      x_max: 3800
      y_min: 200
      y_max: 3800

    on_touch:   # Touch event handler
    - lambda: |-
        ESP_LOGI("touch", "x=%d, y=%d, x_raw=%d, y_raw=%d",   
            touch.x,
            touch.y,
            touch.x_raw,
            touch.y_raw);

    - if:
        condition:
          and:
            - lambda: 'return (touch.x >= 220 && touch.x <= 240);' 
            - lambda: 'return (touch.y >= 35 && touch.y <= 55);' 
        then:
          - switch.toggle: led_switch   # Toggle LED switch when touched

# ----- Image resources -----  # UI image assets stored in flash
image:
  - file: "light.png"
    id: on_light
    resize: 50x50
    type: RGB565
  - file: "small_hum.png"
    id: small_hum
    resize: 50x75
    type: RGB565
  - file: "small_logo.png"
    id: small_logo
    resize: 250x52
    type: RGB565
  - file: "small_off.png"
    id: small_off
    resize: 50x75
    type: RGB565
  - file: "small_temp.png"
    id: small_temp
    resize: 50x75
    type: RGB565
  - file: "no_light.png"
    id: no_light
    resize: 50x50
    type: RGB565

# ----- Colors -----  # Predefined RGB color constants
color:
  - id: my_red
    red: 100%
    green: 0%
    blue: 0%
  - id: my_white
    red: 100%
    green: 100%
    blue: 100%
  - id: my_green
    red: 0%
    green: 100%
    blue: 0%
  - id: my_blue
    red: 0%
    green: 0%
    blue: 100%
  - id: my_black
    red: 0%
    green: 0%
    blue: 0%

# ----- Display -----  # ILI9341 TFT display configuration
display:
  - platform: ili9xxx
    id: dp
    model: ili9341
    dc_pin: GPIO2
    cs_pin: GPIO15
    reset_pin: GPIO4
    rotation: 90
    color_palette: 8BIT
    color_order: bgr
    invert_colors: false # true  # Color inversion option
    data_rate: 10MHz
    update_interval: 1s   # Screen refresh rate

    lambda: |-   # Display rendering loop
      it.fill(id(my_white));  
      it.image(35, 0, id(small_logo));  
      
      // Toggle icon based on LED switch state  
      if (id(led_switch).state) {
        it.image(35, 150, id(on_light));
        it.printf(40, 210, id(font2),  id(my_black), "ON"); 
      } else {
        it.image(35, 150, id(no_light));
        it.printf(40, 210, id(font2), id(my_black), "OFF");   
      }
      
      it.image(155, 130, id(small_temp));  
      it.image(255, 130, id(small_hum));  
      it.printf(160, 210, id(font2), id(my_black), "%.1f", id(temperature24).state); 
      it.printf(260, 210, id(font2), id(my_black), "%.1f", id(humidity24).state); 
    